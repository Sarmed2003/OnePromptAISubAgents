name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dinolab-web:
    name: DINOLAB web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinolab/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dinolab/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint
        continue-on-error: false

      - name: Type check with TypeScript
        run: npm run type-check
        continue-on-error: false

      - name: Build with Vite
        run: npm run build
        continue-on-error: false

      - name: Run unit tests
        run: npm run test
        continue-on-error: false

      - name: Run smoke tests
        run: bash ../../dinolab/web/smoke-test.sh
        continue-on-error: false

      - name: Report build success
        if: success()
        run: |
          echo "::notice title=CI Pipeline Status::✓ All checks passed"
          echo "Build Status: SUCCESS"
          echo "Completed steps: ESLint (lint), TypeScript (type-check), Vite (build), unit tests, smoke tests"

      - name: Report build failure
        if: failure()
        run: |
          echo "::error title=CI Pipeline Status::✗ CI pipeline failed"
          echo "Build Status: FAILURE"
          echo "Review the logs above to identify which step failed."
          exit 1
